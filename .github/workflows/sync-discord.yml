name: Sync Discord announcements

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch announcements from Discord
        run: python3 scripts/fetch_announcements.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      - name: Commit if anything changed
        run: |
          git config user.name "zero-bot"
          git config user.email "zero-bot@users.noreply.github.com"
          git add announcements.json
          git diff --staged --quiet || (git commit -m "Sync announcements from Discord" && git push)

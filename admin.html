<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | ZERØ</title>
<style>
  :root { --bg:#000; --card:#151515; --line:#2a2a2a; --text:#ededed; --muted:#9a9a9a; --red:#e11d2e; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:600px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  h1 { margin:0; font-size:1.5rem; }
  h2 { font-size:1.05rem; margin:0 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; }
  .tab { white-space:nowrap; background:transparent; color:var(--muted); border:1px solid var(--line); }
  .tab[aria-selected="true"] { background:var(--red); border-color:var(--red); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:.9rem; margin:12px 0 6px; color:var(--muted); }
  input, textarea, select { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#0c0c0c; color:var(--text); font:inherit; }
  textarea { min-height:100px; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--red); outline-offset:1px; }
  button { padding:11px 18px; border-radius:12px; border:0; font:inherit; font-weight:600; cursor:pointer; }
  .primary { background:var(--red); color:#fff; margin-top:14px; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:.85rem; margin:6px 0 0; }
  .item { border-top:1px solid var(--line); padding:14px 0; }
  .item:first-of-type { border-top:0; }
  .item h3 { margin:0 0 4px; font-size:1rem; }
  .item p { margin:0 0 8px; white-space:pre-wrap; }
  .item small { color:var(--muted); }
  .del { padding:6px 12px; font-size:.85rem; margin-left:10px; background:transparent; color:#ff6b75; border:1px solid var(--line); }
  .msg { color:var(--muted); min-height:1.2em; margin-top:10px; font-size:.9rem; }
  .err { color:#ff6b75; }
</style>
</head>
<body hidden>
<div class="wrap">
  <header>
    <h1>Admin</h1>
    <button class="ghost" id="out">Sign out</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="ann" aria-selected="true">Announcements</button>
    <button class="tab" role="tab" data-tab="inbox" aria-selected="false">Inbox messages</button>
    <button class="tab" role="tab" data-tab="site" aria-selected="false">Site status</button>
  </div>

  <section id="ann">
    <div class="card">
      <h2>Post an announcement</h2>
      <form id="f">
        <label for="t">Title</label>
        <input id="t" required maxlength="120">
        <label for="b">Message</label>
        <textarea id="b" required></textarea>
        <button class="primary" type="submit">Post announcement</button>
        <div class="msg err" id="amsg" role="alert"></div>
      </form>
    </div>
    <div class="card">
      <h2>Posted announcements</h2>
      <div id="list"><small>Loading…</small></div>
    </div>
  </section>

  <section id="inbox" hidden>
    <div class="card" data-panel>
      <h2>Welcome message</h2>
      <label for="welcome_message">Shown to new visitors in the Inbox</label>
      <textarea id="welcome_message" data-key="welcome_message"></textarea>
      <button class="primary" data-save>Save welcome message</button>
      <div class="msg" role="status"></div>
    </div>
    <div class="card" data-panel>
      <h2>Weekly challenge</h2>
      <label for="weekly_challenge_title">Title</label>
      <input id="weekly_challenge_title" data-key="weekly_challenge_title" maxlength="120">
      <label for="weekly_challenge_text">What to do this week</label>
      <textarea id="weekly_challenge_text" data-key="weekly_challenge_text"></textarea>
      <button class="primary" data-save>Save weekly challenge</button>
      <div class="msg" role="status"></div>
    </div>
  </section>

  <section id="site" hidden>
    <div class="card" data-panel>
      <h2>Site banner</h2>
      <label for="banner_on">Banner</label>
      <select id="banner_on" data-key="banner_on"><option value="off">Hidden</option><option value="on">Showing</option></select>
      <label for="banner_text">Banner text</label>
      <input id="banner_text" data-key="banner_text" maxlength="200">
      <p class="hint">Good for drops, schedule changes, or special streams.</p>
      <button class="primary" data-save>Save banner</button>
      <div class="msg" role="status"></div>
    </div>
    <div class="card" data-panel>
      <h2>Live status</h2>
      <label for="live_override">Status shown on the site</label>
      <select id="live_override" data-key="live_override"><option value="auto">Automatic (detect TikTok)</option><option value="live">Always show Live</option><option value="offline">Always show Offline</option></select>
      <p class="hint">Use a manual setting if automatic detection ever breaks.</p>
      <button class="primary" data-save>Save status</button>
      <div class="msg" role="status"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const list = $("list");

/* Tabs */
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  ["ann", "inbox", "site"].forEach(id => $(id).hidden = id !== b.dataset.tab);
}));

/* Announcements */
async function loadAnn() {
  const { data, error } = await sb.from("announcements").select("*").order("created_at", { ascending:false });
  list.textContent = "";
  if (error) { list.textContent = "Couldn't load announcements."; return; }
  if (!data.length) { list.innerHTML = "<small>Nothing posted yet. Write your first announcement above.</small>"; return; }
  data.forEach(a => {
    const d = document.createElement("div"); d.className = "item";
    const h = document.createElement("h3"); h.textContent = a.title;
    const p = document.createElement("p"); p.textContent = a.body;
    const s = document.createElement("small"); s.textContent = new Date(a.created_at).toLocaleString();
    const x = document.createElement("button"); x.className = "del"; x.textContent = "Delete";
    x.onclick = async () => { if (confirm("Delete this announcement?")) { await sb.from("announcements").delete().eq("id", a.id); loadAnn(); } };
    s.appendChild(x); d.append(h, p, s); list.appendChild(d);
  });
}
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); $("amsg").textContent = "";
  const { error } = await sb.from("announcements").insert({ title: $("t").value.trim(), body: $("b").value.trim() });
  if (error) { $("amsg").textContent = "Couldn't post. Make sure the SQL setup ran and you're the admin."; return; }
  e.target.reset(); loadAnn();
});

/* Settings (welcome message, challenge, banner, live status) */
async function loadSettings() {
  const { data } = await sb.from("site_settings").select("key,value");
  (data || []).forEach(r => { const el = document.querySelector(`[data-key="${r.key}"]`); if (el) el.value = r.value; });
}
document.querySelectorAll("[data-save]").forEach(btn => btn.addEventListener("click", async () => {
  const panel = btn.closest("[data-panel]");
  const msg = panel.querySelector(".msg");
  const rows = [...panel.querySelectorAll("[data-key]")].map(el => ({ key: el.dataset.key, value: el.value.trim(), updated_at: new Date().toISOString() }));
  const { error } = await sb.from("site_settings").upsert(rows, { onConflict: "key" });
  msg.className = "msg" + (error ? " err" : "");
  msg.textContent = error ? "Couldn't save. Run supabase-settings.sql in Supabase first." : "Saved.";
}));

$("out").onclick = async () => { await sb.auth.signOut(); location.href = "login.html"; };

(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session || !(await isAdmin(data.session.user))) { location.href = "login.html"; return; }
  if (self !== top) { document.querySelector('header').hidden = true; document.body.style.padding = '0 0 20px'; }
  document.body.hidden = false; loadAnn(); loadSettings();
})();
</script>
</body>
</html>
